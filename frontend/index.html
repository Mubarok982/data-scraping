<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDC Warehouse — Data Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0d14; }
        ::-webkit-scrollbar-thumb { background: #2d334d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #6366f1; }
    </style>
</head>
<body class="bg-[#0b0d14] text-gray-200 h-screen overflow-hidden font-sans flex">

    <!-- LEFT SIDEBAR NAVBAR -->
    <aside class="w-64 bg-[#111420] border-r border-gray-800 flex flex-col h-full flex-shrink-0 z-20">
        <div class="h-16 flex items-center px-5 border-b border-gray-800 gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center shadow-lg">
                <span class="text-sm">🧩</span>
            </div>
            <span class="font-bold text-white tracking-tight">DDC Portal</span>
        </div>
        <nav class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
            <div class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2 px-2">Menu Utama</div>
            
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl font-medium transition border border-indigo-500/30">
                <span>🗄️</span> Data Explorer
            </a>
            <a href="/analytics" class="flex items-center gap-3 px-3 py-2.5 text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-xl font-medium transition">
                <span>📊</span> Analytics Dashboard
            </a>
            
            <div class="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2 px-2">Scraper Engine</div>
            
            <button onclick="switchTab('keyword')" id="tab-keyword" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-lg transition text-left">
                🔍 Keyword & Trend
            </button>
            <button onclick="switchTab('berita')" id="tab-berita" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-lg transition text-left">
                📰 Portal Berita
            </button>
            <button onclick="switchTab('sosmed')" id="tab-sosmed" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-lg transition text-left">
                📱 Social Media
            </button>
            <button onclick="switchTab('bank')" id="tab-bank" class="w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-lg transition text-left">
                🏦 Arsip CSV Lokal
            </button>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <a href="/docs" target="_blank" class="flex items-center justify-center gap-2 w-full py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-lg transition text-gray-300">
                ⚙️ Swagger API
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- TOP HEADER -->
        <header class="h-16 bg-[#0b0d14]/90 backdrop-blur border-b border-gray-800 flex items-center justify-between px-6 flex-shrink-0">
            <h2 class="text-lg font-bold text-white">Database & Scraper Explorer</h2>
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 rounded-full text-[11px] font-semibold bg-emerald-950/80 text-emerald-400 border border-emerald-800 flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Supabase Active
                </span>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT -->
        <div class="flex-1 overflow-y-auto p-6">
            <div class="grid grid-cols-1 xl:grid-cols-12 gap-5">
                
                <!-- KOLOM FORM (Kiri Dalam) -->
                <div class="xl:col-span-3 space-y-4">
                    <div class="bg-[#131726] border border-gray-800/90 rounded-2xl p-4 shadow-xl">
                        <div id="form-title" class="text-[11px] font-semibold uppercase tracking-wider text-indigo-400 mb-3">
                            🎛️ Filter Supabase
                        </div>

                        <!-- Form Skema Supabase -->
                        <div id="form-supabase" class="space-y-3">
                            <select id="sb-cat" onchange="executeAction()" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs text-gray-200">
                                <option value="berita">news.articles (Berita)</option>
                                <option value="keyword_trending">keyword.keywords (Trend)</option>
                                <option value="instagram">social.posts (Instagram)</option>
                                <option value="facebook">social.posts (Facebook)</option>
                                <option value="tiktok">social.posts (TikTok)</option>
                                <option value="twitter">social.posts (Twitter / X)</option>
                                <option value="linkedin">social.accounts (LinkedIn)</option>
                            </select>
                            <input id="sb-search" type="text" onkeydown="if(event.key==='Enter') executeAction()" placeholder="Cari kata kunci..." class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                            <input id="sb-limit" type="number" value="200" min="1" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs" placeholder="Limit baris">
                        </div>

                        <!-- Form CSV -->
                        <div id="form-bank" class="hidden space-y-3">
                            <select id="bd-cat" onchange="onBankFilterChange()" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="semua">Semua Kategori</option><option value="berita">Berita</option><option value="keyword_trending">Keyword</option><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="twitter">Twitter</option></select>
                            <select id="bd-tool" onchange="onBankFilterChange()" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="semua">Semua Engine</option><option value="apify">Apify</option><option value="diffbot">Diffbot</option><option value="newsdata">Newsdata</option></select>
                            <select id="bd-file" onchange="executeAction()" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="semua">-- Semua File --</option></select>
                            <input id="bd-search" type="text" onkeydown="if(event.key==='Enter') executeAction()" placeholder="Cari isi CSV..." class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                            <input id="bd-limit" type="number" value="200" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                        </div>

                        <!-- Form Keyword -->
                        <div id="form-keyword" class="hidden space-y-3">
                            <select id="kw-mode" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="/api/v1/keyword/search">Keyword Search</option><option value="/api/v1/keyword/trending">Trending Topic</option></select>
                            <input id="kw-input" type="text" value="karhutla" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                            <input id="kw-limit" type="number" value="30" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                        </div>

                        <!-- Form Berita -->
                        <div id="form-berita" class="hidden space-y-3">
                            <select id="br-engine" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="/api/v1/berita/kombine">Kombine</option><option value="/api/v1/berita/newsdata">Newsdata.io</option><option value="/api/v1/berita/diffbot">Diffbot</option></select>
                            <input id="br-input" type="text" value="prabowo" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                            <input id="br-limit" type="number" value="15" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                        </div>

                        <!-- Form Sosmed -->
                        <div id="form-sosmed" class="hidden space-y-3">
                            <select id="sm-platform" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="instagram">Instagram</option><option value="facebook">Facebook</option><option value="tiktok">TikTok</option><option value="twitter">Twitter / X</option><option value="linkedin">LinkedIn</option></select>
                            <select id="sm-engine" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs"><option value="diffbot">Diffbot</option><option value="apify">Apify</option></select>
                            <input id="sm-input" type="text" value="kebakaranhutan" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                            <input id="sm-limit" type="number" value="15" class="w-full bg-[#0b0d14] border border-gray-700 rounded-lg p-2.5 text-xs">
                        </div>

                        <button onclick="executeAction()" id="btn-run" class="mt-4 w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-xl shadow-lg transition">
                            Terapkan Filter DB
                        </button>
                    </div>

                    <!-- Cron Trigger (Cepat) -->
                    <div class="bg-[#131726] border border-gray-800/90 rounded-2xl p-4 shadow-xl">
                        <div class="text-[11px] font-semibold uppercase text-gray-400 mb-2">⚡ Quick Cron Action</div>
                        <button onclick="triggerCron()" id="btn-cron" class="w-full py-2 px-3 bg-gray-800 hover:bg-gray-700 text-white font-semibold text-xs rounded-xl transition">
                            Jalankan Batch 1000 Baris
                        </button>
                    </div>
                </div>

                <!-- KOLOM TABEL (Kanan Dalam) -->
                <div class="xl:col-span-9">
                    <div class="bg-[#131726] border border-gray-800/90 rounded-2xl p-4 shadow-xl flex flex-col h-[calc(100vh-140px)]">
                        <div class="flex flex-wrap justify-between items-center gap-2 pb-3 mb-3 border-b border-gray-800 flex-shrink-0">
                            <div>
                                <h2 class="text-sm font-bold text-white flex items-center gap-2">
                                    📊 Output Data
                                    <span class="text-[10px] font-normal px-2 py-0.5 bg-indigo-950 text-indigo-300 border border-indigo-800 rounded-full">
                                        <span id="row-count">0</span> baris
                                    </span>
                                </h2>
                                <p id="status-text" class="text-[11px] text-gray-400 mt-0.5">Siap memuat data.</p>
                            </div>
                            <div>
                                <a id="btn-download" href="#" class="hidden px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-lg transition shadow">📥 Download CSV</a>
                            </div>
                        </div>

                        <div class="flex-1 overflow-y-auto border border-gray-800/80 rounded-xl bg-[#0b0d14]">
                            <table class="w-full text-left text-xs text-gray-300">
                                <thead id="table-head" class="bg-[#161b2e] text-gray-300 uppercase text-[10px] sticky top-0 z-10 shadow-sm"></thead>
                                <tbody id="table-body" class="divide-y divide-gray-800/70">
                                    <tr><td class="p-8 text-center text-gray-500">Memuat data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        let currentMode = 'supabase';

        function switchTab(mode) {
            currentMode = mode;
            // Reset Sidebar Styling
            ['keyword', 'berita', 'sosmed', 'bank'].forEach(t => {
                document.getElementById('tab-' + t).className = "w-full flex items-center gap-3 px-3 py-2 text-sm text-gray-400 hover:text-gray-200 hover:bg-[#1a1f33] rounded-lg transition text-left";
            });
            
            // Hide all forms
            ['supabase', 'bank', 'keyword', 'berita', 'sosmed'].forEach(t => {
                document.getElementById('form-' + t).classList.add('hidden');
            });

            const runBtn = document.getElementById('btn-run');
            const formTitle = document.getElementById('form-title');

            if (mode === 'supabase') {
                document.getElementById('form-supabase').classList.remove('hidden');
                runBtn.innerText = "Terapkan Filter DB";
                formTitle.innerText = "🎛️ Filter Supabase";
            } else {
                document.getElementById('tab-' + mode).className = "w-full flex items-center gap-3 px-3 py-2 text-sm bg-[#1a1f33] text-white rounded-lg transition text-left";
                document.getElementById('form-' + mode).classList.remove('hidden');
                runBtn.innerText = mode === 'bank' ? "Terapkan Filter CSV" : "Jalankan Scraper";
                formTitle.innerText = mode === 'bank' ? "🎛️ Filter CSV Lokal" : "🎛️ Parameter Scraper";
            }

            if (mode === 'supabase' || mode === 'bank') executeAction();
        }

        async function triggerCron() {
            const btn = document.getElementById('btn-cron');
            btn.disabled = true; btn.innerText = "⏳ Memproses...";
            try {
                await fetch('/api/v1/scheduler/run-now', { method: 'POST' });
                alert("Trigger cron 1000 baris berjalan di background!");
            } catch (e) { alert(e.message); }
            finally { btn.disabled = false; btn.innerText = "Jalankan Batch 1000 Baris"; }
        }

        async function populateFileDropdown() {
            try {
                const res = await fetch(`/api/v1/bank-data/catalog?category=${document.getElementById('bd-cat').value}&tool=${document.getElementById('bd-tool').value}&schema_mode=semua`);
                const json = await res.json();
                const sel = document.getElementById('bd-file');
                sel.innerHTML = '<option value="semua">-- Semua File --</option>';
                (json.catalog || []).forEach(f => {
                    sel.innerHTML += `<option value="${f.filename}">${f.filename}</option>`;
                });
            } catch (e) { }
        }

        async function onBankFilterChange() { await populateFileDropdown(); await executeAction(); }

        async function executeAction() {
            const btn = document.getElementById('btn-run');
            const status = document.getElementById('status-text');
            const dlBtn = document.getElementById('btn-download');
            btn.disabled = true; dlBtn.classList.add('hidden');

            try {
                let url = '', payload = null, method = 'GET';
                
                if (currentMode === 'supabase') {
                    btn.innerText = "⏳ Querying DB...";
                    url = `/api/v1/warehouse/records?category=${document.getElementById('sb-cat').value}&search_query=${encodeURIComponent(document.getElementById('sb-search').value)}&limit=${document.getElementById('sb-limit').value}`;
                } else if (currentMode === 'bank') {
                    btn.innerText = "⏳ Memfilter...";
                    url = `/api/v1/bank-data/records?category=${document.getElementById('bd-cat').value}&tool=${document.getElementById('bd-tool').value}&schema_mode=semua&search_query=${encodeURIComponent(document.getElementById('bd-search').value)}&limit=${document.getElementById('bd-limit').value}`;
                    const f = document.getElementById('bd-file').value;
                    if (f !== 'semua') url += `&filename=${encodeURIComponent(f)}`;
                } else {
                    btn.innerText = "⏳ Scraping...";
                    method = 'POST';
                    if (currentMode === 'keyword') {
                        url = document.getElementById('kw-mode').value;
                        const v = document.getElementById('kw-input').value;
                        const l = document.getElementById('kw-limit').value;
                        payload = url.includes('trending') ? {kategori: v, geo: "ID", max_results: l} : {keyword: v, geo: "ID", max_results: l};
                    } else if (currentMode === 'berita') {
                        url = document.getElementById('br-engine').value;
                        payload = {keyword_or_url: document.getElementById('br-input').value, max_results: document.getElementById('br-limit').value};
                    } else {
                        const pf = document.getElementById('sm-platform').value;
                        url = '/api/v1/sosmed/' + pf;
                        payload = {keyword: document.getElementById('sm-input').value, engine: document.getElementById('sm-engine').value, max_results: document.getElementById('sm-limit').value};
                        if (pf==='facebook' || pf==='instagram') payload.keyword_or_url = payload.keyword;
                    }
                }

                const res = await fetch(url, { method, headers: payload ? {'Content-Type': 'application/json'} : {}, body: payload ? JSON.stringify(payload) : null });
                const json = await res.json();
                
                renderTable(json.data || []);
                document.getElementById('row-count').innerText = json.returned_rows || json.total || 0;
                status.innerText = "✅ Data berhasil dimuat.";
                if (json.csv) { dlBtn.href = "/api/v1/download?path=" + encodeURIComponent(json.csv); dlBtn.classList.remove('hidden'); }
            } catch (err) {
                status.innerText = "❌ Error: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = (currentMode === 'supabase') ? "Terapkan Filter DB" : (currentMode === 'bank' ? "Terapkan Filter CSV" : "Jalankan Scraper");
            }
        }

        function renderTable(rows) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            thead.innerHTML = ''; tbody.innerHTML = '';
            if (!rows.length) { tbody.innerHTML = '<tr><td class="p-8 text-center text-gray-500">Tidak ada data.</td></tr>'; return; }
            
            const cols = Array.from(new Set(rows.flatMap(Object.keys)));
            thead.innerHTML = '<tr>' + cols.map(c => `<th class="px-4 py-3 border-b border-gray-800 whitespace-nowrap">${c}</th>`).join('') + '</tr>';
            rows.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-[#1a2036] transition";
                tr.innerHTML = cols.map(c => {
                    let val = r[c] !== null && r[c] !== undefined ? String(r[c]) : '';
                    if (val.startsWith('http')) return `<td class="px-4 py-2.5 whitespace-nowrap"><a href="${val}" target="_blank" class="text-indigo-400 hover:underline">Link</a></td>`;
                    return `<td class="px-4 py-2.5 whitespace-nowrap">${val.length > 80 ? val.substring(0, 80) + '...' : val}</td>`;
                }).join('');
                tbody.appendChild(tr);
            });
        }

        window.onload = () => { populateFileDropdown(); executeAction(); };
    </script>
</body>
</html>
